name: iptv_native
description: Shared native playback engine plus CarPlay / Android Auto browsing for the IPTV feature.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.iptv_native
        pluginClass: IptvNativePlugin
      ios:
        pluginClass: IptvNativePlugin
